name: build-feed

on:
  schedule:
    # 6時間ごと（UTC基準）。cronの実行は数分〜十数分ずれることがある
    - cron: "23 */6 * * *"
  workflow_dispatch: # 手動実行ボタン
  push:
    branches: [main]
    paths: ["feed.py", ".github/workflows/build-feed.yml"]

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: フィードを生成
        env:
          SOURCE_URL: ${{ vars.SOURCE_URL }}
        run: python feed.py

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
